[project]
name = "ict-bot"
version = "0.1.0"
description = "Opening Range Breakout paper-trading bot for SPY on Alpaca (paper)."
readme = "README.md"
authors = [
    { name = "Hatim Piplodwala", email = "hpiplodwala110@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "alpaca-py>=0.43.4",
    "backtesting>=0.6.5",
    "duckdb>=1.5.3",
    "httpx>=0.28.1",
    "pandas>=3.0.3",
    "pandas-ta-classic>=0.6.20",
    "pyarrow>=24.0.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
]

[project.scripts]
ict-bot = "ict_bot.main:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
