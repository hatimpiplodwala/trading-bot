# ORB bot configuration. Secrets live in .env, NOT here.
# All times are ET (America/New_York). DST is handled in code (Gotcha #4) by
# resolving these wall-clock ET windows against the current offset — never
# hardcode a fixed UTC/GST offset.

symbol: SPY

# SMT divergence reference symbols (input only — never traded in v1, Gotcha #8).
smt_reference_symbols: [QQQ, IWM]

# Timeframes maintained in the store. Entry TF is the base stream; the rest gate.
# Entry moved 5m -> 15m in the structural rework: 5m noise was chopping intraday
# trades out before the move developed (knife-edge breakeven win rate).
timeframes: [5m, 15m, 1h, 4h, 1d]
entry_timeframe: 15m

data:
  feed: iex            # free Alpaca tier (Gotcha #5 — validate before trusting)
  history_years: 2

risk:
  risk_per_trade: 0.005      # 0.5% of equity per trade
  daily_loss_limit: 0.02     # halt new entries at -2% realized P&L per ET day
  max_concurrent_positions: 1
  atr_length: 14
  atr_floor_mult: 0.5        # stop = nearest structural swing, but never tighter than 0.5*ATR
  integer_shares_only: true  # Alpaca rejects bracket orders on fractional shares (Gotcha #9)

# Intraday exits: no new entries late in the day, force flat before the close.
exits:
  no_entry_after: "15:30"       # ET — too late to develop intraday; observe only
  flatten_time: "15:45"         # ET — force-close any open position on/after this bar

regular_hours: { start: "09:30", end: "16:00" }
opening_range: { start: "09:30", end: "10:00" }

# Opening Range Breakout (momentum strategy, both directions). The opening range
# is opening_range.start..opening_range.end; the first 15m bar to close beyond it
# triggers a breakout entry (one/day), stopped at the opposite side of the range
# and flat by exits.flatten_time.
orb:
  stop_atr_floor_mult: 0.5   # stop at the opposite OR side, but never < 0.5*ATR from entry
  target_rr: null            # optional R-multiple target; null = exit only at the close

# Live paper loop (Phase 7). Trades the ORB signal on `symbol` above (SPY — the
# robust vehicle in the 4.5yr hardening; QQQ just-missed the gate).
broker:
  paper: true                # Alpaca paper account (never live capital in v1)
  state_db: data/state.db    # SQLite signal/trade log (gitignored data/ dir)
live:
  poll_buffer_seconds: 20    # wait after each 15m boundary for the bar to finalize
  seed_days: 4               # history pulled at startup to seed ATR + opening range
service:
  log_file: logs/ictbot.log  # daily-rotating, 30-day retention (Phase 8)
  max_frame_bars: 500        # cap the rolling bar frame so RSS stays flat on long runs

timezone:
  market: America/New_York   # ET, DST-aware
  display: Asia/Dubai        # GST (UTC+4) for human-facing display; logs stay UTC

backtest:
  train_months: 18           # in-sample tuning window
  oos_months: 6              # untouched out-of-sample window (the verdict)
  slippage_cents: 1          # paper fills are optimistic (Gotcha #7)

alerts:
  heartbeat_hours: 1
  daily_summary_et: "16:05"
